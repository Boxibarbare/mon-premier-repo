<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Amour Crochet Garden</title>
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css?v=2">
</head>
<body class="login-page">
    <header class="login-header">
        <a href="/" class="login-header-logo">Amour Crochet Garden</a>
        <a href="/" class="login-header-link">Voir le site</a>
    </header>
    <div class="login-wrapper">
        <div class="login-container">
            <h1>Admin</h1>
            <p class="login-subtitle">Connectez-vous pour accéder au panel</p>
            {% if error %}
            <p class="error-msg">{{ error }}</p>
            {% endif %}
            <form action="/admin/login" method="post" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="text" name="username" placeholder="Nom d'utilisateur" required autocomplete="username">
                <input type="password" name="password" placeholder="Mot de passe" required autocomplete="current-password">
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </div>
</body>
</html>
